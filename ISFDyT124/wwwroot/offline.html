<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sin conexión - Sistema de Asistencias</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .offline-wrap {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            box-sizing: border-box;
        }
        .offline-wrap img { max-width: 100px; margin-bottom: 24px; }
        .offline-wrap h1 { color: var(--primary-color, #002e8c); font-size: 1.3rem; margin-bottom: 12px; }
        .offline-wrap p { color: var(--text-muted, #64748b); max-width: 340px; }
        .offline-wrap button {
            margin-top: 24px;
            background-color: var(--primary-color, #002e8c);
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 12px 28px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="offline-wrap">
        <img src="/images/logo.png" alt="IS 124">
        <h1>Sin conexión</h1>
        <p>No se pudo cargar esta página porque no hay conexión a internet en este momento. Cuando vuelva la señal, volvé a intentar.</p>
        <button onclick="location.reload()">Reintentar</button>
    </div>
</body>
</html>
